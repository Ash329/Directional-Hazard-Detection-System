<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f97316">
    <meta name="description" content="Real-time directional hazard detection with spoken alerts for visually impaired users.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Hazard Detect">
    <title>{% block title %}Directional Hazard Detection{% endblock %}</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="{{ asset_url('icons/favicon-32.png') }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ asset_url('icons/apple-touch-icon.png') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ asset_url('styles.css') }}">
</head>
<body>
    <div class="site-shell">
        {% block content %}{% endblock %}
    </div>

    <script src="{{ asset_url('app.js') }}" defer></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker
                    .register("/service-worker.js", { scope: "/" })
                    .catch((error) => console.error("Service worker registration failed.", error));
            });
        }
    </script>
</body>
</html>
